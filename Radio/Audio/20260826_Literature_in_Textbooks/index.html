<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="https://flareu-tw-trans.github.io/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="https://flareu-tw-trans.github.io/images/favicon.png">
<link rel="stylesheet" href="../../../css/reaction.css">
  
<title>20260628 朗讀教科書中的文學作品</title>

<style>

</style>
</head>

<body>
  
<!-- 第一層：成員切換 -->
<div class="member-tabs">
  <button class="tab-btn active" data-member="leeyu">崔立于</button>
  <button class="tab-btn" data-member="woojin">崔玗进</button>
</div>

<!-- 第二層：閱讀模式切換 -->
<div class="mode-toggle">
  <button class="mode-btn active" data-mode="dynamic">🎵 動態逐句</button>
  <button class="mode-btn" data-mode="full">📖 完整全文</button>
</div>

<!-- 內容顯示區域 -->
<div id="content-display">
  <!-- JavaScript 會根據 (member + mode) 動態渲染相對應的區塊 -->
</div>

<script>
// 當前頁面狀態
let currentState = {
  member: 'leeyu', // 'leeyu' | 'woojin'
  mode: 'dynamic'  // 'dynamic' | 'full'
};

function updateView() {
  // 1. 隱藏所有內容區塊
  document.querySelectorAll('.poem-container').forEach(el => el.style.display = 'none');
  
  // 2. 顯示當前組合的區塊，例如：#poem-leeyu-dynamic
  const activeContainer = document.querySelector(`#poem-${currentState.member}-${currentState.mode}`);
  if (activeContainer) {
    activeContainer.style.display = 'block';
  }
}
</script>
    
<script type="module" src="../../../js/firebase-init.js"></script>

<script src="../../../js/core-player.js"></script>
<script src="../../../js/reaction-core.js"></script>

</body>
</html>
