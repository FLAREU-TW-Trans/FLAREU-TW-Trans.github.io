00:04:13,800 --> 00:04:19,600
그는 반드시 관상을 특별히 잘 보는 사람일 거요."

49
00:04:19,600 --> 00:04:26,200
나는 목욕하고 옷매무새를 단정히 하여 그 관상쟁이가 사는 곳에 찾아갔다.

50
00:04:26,200 --> 00:04:33,200
그리고 그의 곁에 있는 사람들을 모두 물러가게 하고는 그에게 이렇게 물어보았다.

51
00:04:33,200 --> 00:04:39,700
"당신이 이러이러한 사람들의 관상을 보고 '이러이러하다'라고 말한 것은 어째서요?"

52
00:04:39,700 --> 00:04:42,800
그는 이렇게 대답했다.

53
00:04:42,800 --> 00:04:48,000
 "부유하고 신분이 높으면, 거만하고 남을 업신여기는 마음이 자랍니다.

54
00:04:48,000 --> 00:04:56,600
그리하여 죄가 가득 차면 하늘이 반드시 그 사람을 거꾸러뜨려 장차 겨죽도 못 먹을 때가 오게 됩니다.

55
00:04:56,600 --> 00:05:07,000
그러니 '여위었다'라고 한 것이고, 앞으로 보잘것없는 비천한 사나이가 될 테니 '당신의 족속이 천할 것이다'라고 한 겁니다.

56
00:05:07,000 --> 00:05:15,900
가난하고 신분이 낮으면, 뜻을 굽히고 자신을 낮추어 걱정하고 두려워하며, 반성하고 수양하는 마음이 있게 됩니다.

57
00:05:15,900 --> 00:05:21,500
그러다 막힌 운수가 끝나면 반드시 운수가 트이게 되는 법이지요.

58
00:05:21,500 --> 00:05:26,800
그러니 육식을 하며 부귀하게 살 징조가 보여 '살쪘다'라고 한 것이고,

59
00:05:26,800 --> 00:05:37,100
앞으로 만 석의 봉급을 받고 다섯 대의 수레를 굴릴 만큼 존귀하게 될 테니 '당신의 족속이 귀할 것이다'라고 한 겁니다.

60
00:05:37,100 --> 00:05:42,400
요염한 자태와 아름다운 얼굴을 엿보다가는 위험을 건드리기 쉽고,

61
00:05:42,400 --> 00:05:45,800
진귀하고 좋은 보배를 보면 욕심이 생깁니다.

62
00:05:45,800 --> 00:05:53,300
그러니 사람의 마음을 혹하게 하고 사람의 바른 마음을 구부러뜨리는 것은 눈이라 하겠습니다.

63
00:05:53,300 --> 00:06:02,200
눈에 보이는 대로 따르다가 생각도 못 한 치욕을 당하게 되니 이 어찌 눈먼 것이라 하지 않겠습니까?

64
00:06:02,200 --> 00:06:11,000
그렇지만 장님은 마음이 맑아 욕심도 위험도 없으니 몸을 온전히 지킬 수 있고 치욕을 당할 일도 없습니다.

65
00:06:11,000 --> 00:06:19,900
이런 점은 현명한 사람이나 깨달은 사람보다 낫다고 하겠기에 '눈이 밝다'라고 한 겁니다.

66
00:06:19,900 --> 00:06:27,500
대체로 민첩한 사람은 용맹을 좋아하는데, 용맹한 이는 다른 많은 사람을 깔보기가 쉽습니다.

67
00:06:27,500 --> 00:06:35,400
그러다 결국에는 자객이나 악당의 우두머리나 되었다가, 무관에게 잡히고 옥에 갇혀 감시를 받겠지요.

68
00:06:35,400 --> 00:06:42,600
발에는 차꼬를 차고 목에는 큰칼을 썼으니 아무리 달아나려 한들 그럴 수 있겠습니까?

69
00:06:42,600 --> 00:06:47,200
그래서 '절름발이라 걸을 수 없다'라고 한 겁니다.

70
00:06:47,200 --> 00:06:56,300
그리고 빼어난 미모라는 것은, 음탕하고 사치스러운 자가 보면 귀한 구슬처럼 고와 보이겠지만

71
00:06:56,300 --> 00:07:02,200
정직하고 순박한 사람이 보면 진흙처럼 흉해 보이는 법입니다.

72
00:07:02,200 --> 00:07:08,100
그래서 '아름답기도 하고 못나기도 하다'라고 한 것이지요.

73
00:07:08,100 --> 00:07:20,100
한편 어질다는 사람이 죽으면 사람들이 북적북적 모여 그를 그리며 눈물을 흘리고 마치 어머니를 잃은 어린 아기처럼 슬퍼할 것입니다.

74
00:07:20,100 --> 00:07:25,200
그래서 '만인의 마음을 아프게 한다'라고 한 겁니다.

75
00:07:25,200 --> 00:07:34,900
반면에 몹시 잔인한 사람이 죽으면, 길거리마다 노래를 주고받고 양고기 안주에 술을 차려 놓고 축하하게 될 것입니다.

76
00:07:34,900 --> 00:07:41,800
이 중에는 웃느라 입을 다물지 못하고, 손바닥이 찢어져라 손뼉을 칠 사람도 있겠지요.

77
00:07:41,800 --> 00:07:48,200
그래서 '만인을 기쁘게 한다'라고 한 겁니다."

78
00:07:48,200 --> 00:07:51,800
나는 깜짝 놀라 일어나서 이렇게 말했다.

79
00:07:51,800 --> 00:07:57,400
"과연 내 말이 맞았구나. 이 사람은 정말 관상을 유별나게 잘 보는구나!

80
00:07:57,400 --> 00:08:01,300
그의 말은 좌우명과 교훈으로 삼을 만하다.

81
00:08:01,300 --> 00:08:06,900
이 사람은 결코, 얼굴 모양이나 표정만을 살펴 귀티가 나면

82
00:08:06,900 --> 00:08:14,500
'몸에 거북 무늬가 있어 높은 벼슬하겠고, 코가 무소뿔 모양이라 왕비가 될 상'이라 하고,

83
00:08:14,500 --> 00:08:21,800
관상이 나쁘면 '벌의 눈처럼 퉁방울눈에다, 목소리는 표범처럼 날카로워 흉악한 상'

84
00:08:21,800 --> 00:08:32,200
이라는 식으로 늘 하던 대로 똑같은 말만 주워섬기면서 스스로 신통하다고 떠벌리는 그런 관상쟁이가 아닌 것이다."

85
00:08:32,200 --> 00:08:41,700
그리고 집에 돌아와 그의 대답을 적어 둔다.

86
00:08:41,700 --> 00:08:46,000
이규보의 한문수필 이상한 관상쟁이 읽어드렸습니다.

87
00:08:46,000 --> 00:08:51,200
맨날 노래만 녹음하다가 이렇게 문학작품을 낭독을 하다 보니까

88
00:08:51,200 --> 00:08:56,600
뭔가 잘 읽어야 된다 이런 생각도 있어서 되게 열심히 노력하면서 읽은 것 같은데요.

89
00:08:56,600 --> 00:09:01,200
어떻게 여러분은 관상쟁이의 말을 들으면서 어떤 생각이 드셨나요.

90
00:09:01,200 --> 00:09:04,800
부유한 일을 수척하고 천하다고 하고

91
00:09:04,800 --> 00:09:09,000
가난한 일을 귀하고 살쪘다며 칭찬하는 말들

92
00:09:09,000 --> 00:09:14,300
처음엔 터무니없어 보였지만 설명을 들으면 모든 게 딱 맞아 떨어지죠.

93
00:09:14,300 --> 00:09:19,900
저도 데뷔 후 무대 경험이 쌓이면서 생각이 조금씩 바뀌었어요.

94
00:09:19,900 --> 00:09:26,000
처음엔 화려한 조명과 퍼포먼스 같은 것들이 저를 완성한다고 믿었습니다.

95
00:09:26,000 --> 00:09:33,500
하지만 시간이 지나고 어느 순간 제가 어떤 마음으로 노래하는지가 더 크게 전해진다는 걸 느꼈어요.

96
00:09:33,500 --> 00:09:35,500
그때 알게 됐습니다.

97
00:09:35,500 --> 00:09:42,100
겉으로 보이는 모습이 아니라 저의 태도와 진심이 마음에 더 오래 남는다는 걸요.

98
00:09:42,100 --> 00:09:47,600
이 작품 속 이상한 관상쟁이도 바로 그 지점을 얘기하고 있습니다.

99
00:09:47,600 --> 00:09:54,400
그 사람이 어떤 마음으로 살아가고 있는지 어떤 방향으로 나아가고 있는지를 본 거죠.

100
00:09:54,400 --> 00:10:03,800
이 작품은 이규보가 관상쟁이와 주고받은 대화를 기록했다고 해서 원래 제목은 이상자대 라고 불립니다.

101
00:10:03,800 --> 00:10:11,600
작가는 이 대화 형식을 통해 외모로 사람을 판단하는 낡은 관습을 통쾌하게 비판하죠.

102
00:10:11,600 --> 00:10:17,700
우리가 학교에서 배우는 설이라는 문학양식도 바로 이런 흐름을 따릅니다.

103
00:10:17,700 --> 00:10:22,700
사물의 이치를 풀이하고 작가의 의견을 덧붙이는 방식인데요.

104
00:10:22,700 --> 00:10:29,100
이규보는 다양한 설을 통해 시대를 관통하는 날카로운 사유를 남겼습니다.

105
00:10:29,100 --> 00:10:32,200
무엇을 보고 사람을 판단할 것인가?

106
00:10:32,200 --> 00:10:41,400
이 질문이 여러분의 공부는 물론 앞으로 누군가를 만나고 세상을 살아가는 데에도 작지만 소중한 지표가 됐으면 좋겠습니다.

107
00:10:41,400 --> 00:10:48,400
그럼 지금까지 플레어유의 강우진이었습니다.`,
        chi: `1
00:00:00,000 --> 00:00:09,400
姜玗進朗讀教科書中的文學作品

2
00:00:09,400 --> 00:00:12,800
大家好 我是FLARE U姜玗進

3
00:00:12,800 --> 00:00:17,000
各位第一次看到一個人時，會先看哪裡呢？

4
00:00:17,000 --> 00:00:20,300
臉？氣質？還是感覺？

5
00:00:20,300 --> 00:00:25,400
其實我以前也很容易受到外在形象的影響

6
00:00:25,400 --> 00:00:28,100
尤其是在參加選秀節目的時候

7
00:00:28,100 --> 00:00:36,400
有時候僅僅透過幾秒鐘的舞台、幾個影片片段，就會讓人產生「啊，這個人就是這樣的人」的印象，甚至擅自做出判斷

8
00:00:36,400 --> 00:00:40,200
每當那個時候，我就會這麼想

9
00:00:40,200 --> 00:00:44,400
從外表所看到的樣子，就是一個人的全部嗎？

10
00:00:44,400 --> 00:00:50,000
從現在開始，我要介紹給大家的這篇故事，也正是從這個問題出發的

11
00:00:50,000 --> 00:00:57,900
這是收錄在高中文學教科書中，高麗時代文人李奎報的漢文隨筆《奇怪的觀相師》

12
00:00:57,900 --> 00:01:04,400
這是一部以問答形式描寫作者與一名觀相師對話的作品

13
00:01:04,400 --> 00:01:12,400
李奎報是高麗時代的文臣兼文人，寫過許多勇於打破常識與成見的文章

14
00:01:12,400 --> 00:01:20,800
在這個故事中，作者透過一名不看外貌，而是看出一個人的生活、態度以及未來方向的觀相師

15
00:01:20,800 --> 00:01:25,200
讓我們重新思考並顛覆一直以來熟悉並深信的判斷標準

16
00:01:25,200 --> 00:01:28,000
「該以什麼為基準來判斷一個人？」

17
00:01:28,000 --> 00:01:38,000
那麼就讓我們一邊想著這個問題，一起聆聽我為大家朗讀李奎報的《奇怪的觀相師》吧

18
00:01:38,000 --> 00:01:43,600
《奇怪的觀相師》，李奎報

19
00:01:43,600 --> 00:01:46,300
有一個觀相師

20
00:01:46,300 --> 00:01:54,400
沒有人知道他從哪裡來，他也沒有特別讀過看相的書，更不遵循看相的法則

21
00:01:54,400 --> 00:02:01,900
卻能以奇特的方式精準看相，因此大家都稱他為「奇怪的觀相師」

22
00:02:01,900 --> 00:02:05,400
無論是那些自命端莊、講究體面的官吏，還是男女老少

23
00:02:05,400 --> 00:02:11,300
全都爭先恐後地請他到家裡來，或親自去找他，請他替自己看相

24
00:02:11,300 --> 00:02:20,000
那名觀相師看到那些富有、身分高貴且體態肥胖、面帶油光的人，就對他說：

25
00:02:20,000 --> 00:02:25,800
「您的樣子看起來十分消瘦，世上再沒有比您更卑賤的人了。」

26
00:02:25,800 --> 00:02:31,600
另一方面，看到貧窮、卑微且消瘦的人，他就說：

27
00:02:31,600 --> 00:02:37,800
「您的樣子看起來很肥胖，世上像您這般尊貴的人，恐怕也不多見。」

28
00:02:37,800 --> 00:02:40,700
看到盲人的相貌，他說：

29
00:02:40,700 --> 00:02:43,600
「這是個雙眼明亮的人。」

30
00:02:43,600 --> 00:02:48,600
看到身手敏捷且擅長奔跑的人，他說：

31
00:02:48,600 --> 00:02:52,300
「這是一個跛腳、無法行走的人。」

32
00:02:52,300 --> 00:02:56,300
看到容貌出眾的婦人，他說：

33
00:02:56,300 --> 00:03:00,200
「既美麗，又醜陋。」

34
00:03:00,200 --> 00:03:05,600
看到被世人譽為寬厚仁慈的人，他說：

35
00:03:05,600 --> 00:03:09,000
「他將會讓天下人的心感到痛楚。」

36
00:03:09,000 --> 00:03:14,700
看到當時被世人稱為極其殘忍的人，他說：

37
00:03:14,700 --> 00:03:19,300
「他將會讓天下人的心感到歡喜。」

38
00:03:19,300 --> 00:03:22,200
他的看相方式幾乎都是如此

39
00:03:22,200 --> 00:03:28,700
只是，他不僅不太會說吉凶禍福究竟會如何發生

40
00:03:28,700 --> 00:03:33,200
就連客人的處境、情況之類的事情，也全都無法準確預測

41
00:03:33,200 --> 00:03:37,200
於是眾人紛紛說他是個騙子

42
00:03:37,200 --> 00:03:42,000
應該把他抓起來審問，以說謊之罪加以懲處

43
00:03:42,000 --> 00:03:46,400
唯獨我勸阻眾人，說道：

44
00:03:46,400 --> 00:03:52,700
「大抵而言，有些話雖然剛聽時刺耳，但到後來卻能讓人欣然接受；

45
00:03:52,700 --> 00:03:59,700
有些話表面聽來淺薄，內在卻蘊含著深遠的意旨

46
00:03:59,700 --> 00:04:06,200
他畢竟也是一個有眼睛的人，難道會不知道誰是肥胖的人、誰是瘦弱的人、誰是盲人

47
00:04:06,200 --> 00:04:13,800
竟會對肥胖的人說他瘦、對瘦弱的人說他胖，還對盲人說他雙眼明亮嗎？

48
00:04:13,800 --> 00:04:19,600
他必定是一位特別善於看相的人」

49
00:04:19,600 --> 00:04:26,200
於是我便沐浴更衣、整頓衣冠，前往那名觀相師住的地方

50
00:04:26,200 --> 00:04:33,200
我讓他身旁的人全都退下，然後向他這樣問道：

51
00:04:33,200 --> 00:04:39,700
「您替這些人看相，說他們『如此如此』，究竟是為什麼呢？」

52
00:04:39,700 --> 00:04:42,800
他這樣回答：

53
00:04:42,800 --> 00:04:48,000
「一個人富有而且身分高貴，便容易滋長驕傲自大的心，以及輕視他人的念頭

54
00:04:48,000 --> 00:04:56,600
等到他惡貫滿盈，上天必定會使這個人跌倒，將來甚至會到了連糠粥都吃不上的地步

55
00:04:56,600 --> 00:05:07,000
所以我才說他『消瘦』，因為他將來會成為微不足道的人，我才說『你將會變得卑賤』

56
00:05:07,000 --> 00:05:15,900
一個人貧窮而且身分低微，便會卑躬屈膝，憂慮恐懼，從而產生反省自己、修養自己的心

57
00:05:15,900 --> 00:05:21,500
等到困頓的運勢結束，運勢自然就會轉好

58
00:05:21,500 --> 00:05:26,800
所以我看到他將來能吃肉、過著榮華富貴生活的徵兆，才說他『肥胖』；

59
00:05:26,800 --> 00:05:37,100
而且他將來會尊貴到享有萬石俸祿、駕馭五輛車馬的地步，所以才說『您將會變得尊貴』

60
00:05:37,100 --> 00:05:42,400
一個人若看見妖嬈的姿態與美麗的容貌，很容易心生慾念而招致危險；

61
00:05:42,400 --> 00:05:45,800
看見珍奇美好的寶物，也容易產生貪欲

62
00:05:45,800 --> 00:05:53,300
因此，最容易迷惑人心、使人的正直之心受到扭曲的，便可以說是眼睛

63
00:05:53,300 --> 00:06:02,200
一個人若一味跟隨眼睛所看見的東西，最後反而會遭受意想不到的羞辱，這怎能不說是盲目呢？

64
00:06:02,200 --> 00:06:11,000
然而盲人內心清明，既沒有貪欲，也沒有危險，因此能夠保全自身，也不會有遭受羞辱的事情

65
00:06:11,000 --> 00:06:19,900
就這一點而言，他甚至比聰明人或有悟性的人更加高明，所以我才說他『雙眼明亮』

66
00:06:19,900 --> 00:06:27,500
大凡身手敏捷的人都喜歡逞勇，而勇猛之人又很容易輕視他人

67
00:06:27,500 --> 00:06:35,400
到頭來，不是成為刺客，就是成為惡棍的首領，最後被武官逮捕、關押入獄受人監視

68
00:06:35,400 --> 00:06:42,600
腳上戴著腳鐐，脖子上套著枷鎖，就算想逃跑，又怎麼逃得掉呢？

69
00:06:42,600 --> 00:06:47,200
所以我才說他『是個跛腳、無法行走的人』

70
00:06:47,200 --> 00:06:56,300
至於所謂的絕世美貌，若被好色奢靡之人看見，便會覺得像珍貴的珠玉般嬌美；

71
00:06:56,300 --> 00:07:02,200
但若被正直樸實的人看見，卻會覺得像泥巴一樣醜陋

72
00:07:02,200 --> 00:07:08,100
所以我才說她『既美麗，又醜陋』

73
00:07:08,100 --> 00:07:20,100
另一方面，那些被稱為仁慈賢德的人死去之後，人們必定會熙熙攘攘地聚集在一起，思念他、為他流淚，悲傷得就像失去母親的幼兒一般

74
00:07:20,100 --> 00:07:25,200
所以我才說『會使天下人的心都感到悲痛』

75
00:07:25,200 --> 00:07:34,900
相反地，一個極其殘忍的人死去時，街頭巷尾都會唱歌相慶，備妥羊肉下酒，慶祝他的死亡

76
00:07:34,900 --> 00:07:41,800
這其中甚至會有人笑得合不攏嘴，拍手拍到手掌快裂開

77
00:07:41,800 --> 00:07:48,200
所以我才說『會使天下人都感到歡喜』。」

78
00:07:48,200 --> 00:07:51,800
我大吃一驚，站起身來說：

79
00:07:51,800 --> 00:07:57,400
「果然我說得沒錯！這個人看相確實不同凡響！

80
00:07:57,400 --> 00:08:01,300
他的話足以作為座右銘與教訓

81
00:08:01,300 --> 00:08:06,900
這個人絕不是那種只觀察人的臉型與表情，看見一副富貴相就說：

82
00:08:06,900 --> 00:08:14,500
『身上有龜形紋，將來必定做大官；鼻子長得像犀牛角，是將來成為王妃的命相。』

83
00:08:14,500 --> 00:08:21,800
看見相貌不好，又照樣說：『眼睛像蜜蜂一樣突出，聲音像豹子一樣尖銳，乃凶惡之相』

84
00:08:21,800 --> 00:08:32,200
總是搬出那千篇一律的說辭，然後自吹自擂、以為自己有什麼神通的觀相師。」

85
00:08:32,200 --> 00:08:41,700
回到家後，我便把他的回答記錄了下來

86
00:08:41,700 --> 00:08:46,000
以上就是我為大家朗讀的李奎報漢文隨筆《奇怪的觀相師》

87
00:08:46,000 --> 00:08:51,200
平時一直都在錄歌，像這樣朗讀文學作品

88
00:08:51,200 --> 00:08:56,600
心中總想著「一定要讀好才行」，所以非常努力地朗讀了

89
00:08:56,600 --> 00:09:01,200
大家聽完觀相師的話後，有什麼想法呢？

90
00:09:01,200 --> 00:09:04,800
把富有的人說成瘦弱卑賤

91
00:09:04,800 --> 00:09:09,000
把貧窮的人讚美成高貴豐潤

92
00:09:09,000 --> 00:09:14,300
這些話一開始聽起來很荒謬，但聽了說明之後，一切就都合情合理了

93
00:09:14,300 --> 00:09:19,900
我也在出道後，隨著舞台經驗逐漸累積，想法逐漸產生了變化

94
00:09:19,900 --> 00:09:26,000
一開始我堅信華麗的燈光和表演才能塑造完美的我

95
00:09:26,000 --> 00:09:33,500
但是隨著時間流逝，我在某個瞬間感受到，自己是抱著什麼樣的心情唱歌，反而能夠更加深刻地傳達給大家

96
00:09:33,500 --> 00:09:35,500
那時我才明白

97
00:09:35,500 --> 00:09:42,100
比起外在所呈現的樣子，我的態度與真心反而能更加長久地留在人們心中

98
00:09:42,100 --> 00:09:47,600
這部《奇怪的觀相師》所講述的也正是這一點

99
00:09:47,600 --> 00:09:54,400
觀察的是那個人懷著怎樣的心情生活，正朝著什麼樣的方向在前進

100
00:09:54,400 --> 00:10:03,800
這部作品記錄了李奎報與觀相師之間一問一答的對話，因此原本的題目稱為《異相者對》

101
00:10:03,800 --> 00:10:11,600
作者透過這種對話形式，痛快地批判了以外貌來判斷一個人的陳舊習俗

102
00:10:11,600 --> 00:10:17,700
我們在學校學到的「說（설）」這種文學體裁，也正是遵循這樣的脈絡

103
00:10:17,700 --> 00:10:22,700
這是一種闡述事物道理，並在其中加入作者自身見解的寫作方式

104
00:10:22,700 --> 00:10:29,100
李奎報透過各種「說」，留下了貫穿時代的敏銳思考

105
00:10:29,100 --> 00:10:32,200
該以什麼為基準來判斷一個人？

106
00:10:32,200 --> 00:10:41,400
希望這個問題不僅能對大家的學習有所幫助，也能成為大家今後與人相處、立足世界時，微小卻珍貴的指引

107

        let currentState = {
            member: localStorage.getItem('app_member') || 'liyu',
            mode: localStorage.getItem('app_mode') || 'dynamic',
            lang: localStorage.getItem('app_lang') || 'all'
        };

        let parsedSubtitles = [];

        // 初始化

            loadAndRenderContent();
            initAudioListener();
        });

        function saveState() {
            localStorage.setItem('app_member', currentState.member);
            localStorage.setItem('app_mode', currentState.mode);
            localStorage.setItem('app_lang', currentState.lang);
        }

        function switchMember(member) {
            currentState.member = member;
            saveState();
            applyStateToUI();
            loadAndRenderContent();
        }

        function switchMode(mode) {
            currentState.mode = mode;
            saveState();
            applyStateToUI();
            loadAndRenderContent();
        }

        function switchLang(lang) {
            currentState.lang = lang;
            saveState();
            applyStateToUI();
            applyLangDisplay();
        }

        function applyStateToUI() {
            // 切換 Member UI
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.member === currentState.member);
            });
            // 切換 Mode UI
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === currentState.mode);
            });
            // 切換 Lang UI
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentState.lang);
            });

            // 顯示/隱藏音訊控制
            const controls = document.getElementById('dynamic-controls');
            controls.style.display = currentState.mode === 'dynamic' ? 'block' : 'none';
            applyLangDisplay();
        }

        function applyLangDisplay() {
            const box = document.getElementById('subtitle-box');
            box.classList.remove('hide-kor', 'hide-chi');
            if (currentState.lang === 'kor') box.classList.add('hide-chi');
            if (currentState.lang === 'chi') box.classList.add('hide-kor');
        }

        function updateAudioSource() {
            const audio = document.getElementById('audio-player');
            audio.muted = true; // 強制靜音，防止產生聲音
            audio.volume = 0;
            
            if (audioSources[currentState.member]) {
                audio.src = audioSources[currentState.member];
                audio.load();
                
                // 如果目前是動態模式，自動觸發背景靜音播放
                if (currentState.mode === 'dynamic') {
                    audio.play().then(() => {
                        updatePlayButtonState(true);
                    }).catch(e => {
                        console.log("自動播放受阻，等待使用者點擊按鈕：", e);
                        updatePlayButtonState(false);
                    });
                }
            }
        }

        function togglePlay() {
            const audio = document.getElementById('audio-player');
            if (audio.paused) {
                audio.play();
                updatePlayButtonState(true);
            } else {
                audio.pause();
                updatePlayButtonState(false);
            }
        }

        function updatePlayButtonState(isPlaying) {
            const btn = document.getElementById('play-toggle-btn');
            if (btn) {
                btn.innerText = isPlaying ? "⏸ 暫停動態同步" : "▶ 開始動態同步";
            }
        }

        /* ==========================================
           5. SRT 解析器與教學單字標記替換
           ========================================== */
        function parseSRT(srtString) {
            const pattern = /(\d+)\n(\d{2}:\d{2}:\d{2},\d{3}) --> (\d{2}:\d{2}:\d{2},\d{3})\n([\s\S]*?)(?=\n\n|\n*$)/g;
            const result = [];
            let matches;
            
            function timeToSeconds(tStr) {
                const [h, m, sWithMs] = tStr.split(':');
                const [s, ms] = sWithMs.split(',');
                return parseInt(h)*3600 + parseInt(m)*60 + parseInt(s) + parseInt(ms)/1000;
            }

            while ((matches = pattern.exec(srtString)) !== null) {
                result.push({
                    id: matches[1],
                    start: timeToSeconds(matches[2]),
                    end: timeToSeconds(matches[3]),
                    text: matches[4].trim()
                });
            }
            return result;
        }

        // 將 {單字} 自動替換為可點擊的 HTML 元素
        function renderVocabText(text) {
            return text.replace(/\{([^}]+)\}/g, (match, word) => {
                if (vocabDb[word]) {
                    return `<span class="vocab-word" onclick="openVocabModal('${word}', event)">${word}</span>`;
                }
                return word;
            });
        }

        /* ==========================================
           6. 載入與渲染內容
           ========================================== */
        function loadAndRenderContent() {
            const korSrt = mockSrtData[currentState.member].kor;
            const chiSrt = mockSrtData[currentState.member].chi;

            const korParsed = parseSRT(korSrt);
            const chiParsed = parseSRT(chiSrt);

            parsedSubtitles = korParsed.map((item, index) => ({
                start: item.start,
                end: item.end,
                kor: item.text,
                chi: chiParsed[index] ? chiParsed[index].text : ''
            }));

            const box = document.getElementById('subtitle-box');
            box.innerHTML = '';

            parsedSubtitles.forEach((item, idx) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'sub-line';
                lineDiv.dataset.index = idx;

                const korHtml = renderVocabText(item.kor);
                const chiHtml = item.chi;

                lineDiv.innerHTML = `
                    <div class="kor-text">${korHtml}</div>
                    <div class="chi-text">${chiHtml}</div>
                `;

                lineDiv.addEventListener('click', (e) => {
                    if (e.target.classList.contains('vocab-word')) return;
                    if (currentState.mode === 'dynamic') {
                        const audio = document.getElementById('audio-player');
                        audio.currentTime = item.start;
                        audio.play();
                        updatePlayButtonState(true);
                    }
                });

                box.appendChild(lineDiv);
            });
            
            updateAudioSource();
        }

        /* ==========================================
           6. 音訊播放與自動捲動同步
           ========================================== */
        function initAudioListener() {
            const audio = document.getElementById('audio-player');
            audio.addEventListener('timeupdate', () => {
                if (currentState.mode !== 'dynamic') return;

                const time = audio.currentTime;
                const activeIndex = parsedSubtitles.findIndex(s => time >= s.start && time <= s.end);

                if (activeIndex !== -1 && activeIndex !== currentSubIndex) {
                    currentSubIndex = activeIndex;
                    highlightCurrentSub(activeIndex);
                    scrollToCurrentSub(false);
                }
            });

            audio.addEventListener('ended', () => {
                updatePlayButtonState(false);
            });
        }

        function highlightCurrentSub(index) {
            document.querySelectorAll('.sub-line').forEach((el, idx) => {
                el.classList.toggle('active', idx === index);
            });
        }

        function scrollToCurrentSub(force = false) {
            if (currentSubIndex === -1 && !force) return;
            const targetIdx = currentSubIndex !== -1 ? currentSubIndex : 0;
            const targetEl = document.querySelector(`.sub-line[data-index="${targetIdx}"]`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function adjustTime(seconds) {
            const audio = document.getElementById('audio-player');
            audio.currentTime = Math.max(0, audio.currentTime + seconds);
        }

        /* ==========================================
           7. 單字發音引擎與 Modal 控制 (內建 Web Speech / Google API)
           ========================================== */
        function playKoreanSpeech(text) {
            // 優先使用 Web Speech API（零延遲、無需外連）
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止先前的發音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8; // 發音速度設定為 0.8
                window.speechSynthesis.speak(utterance);
            } else {
                // 回退備案：使用 Google 翻譯發音音訊 API
                const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=ko&client=tw-ob`;
                const audio = new Audio(googleTtsUrl);
                audio.play().catch(() => {
                    alert("發音播放失敗，請檢查網路連線。");
                });
            }
        }

        function openVocabModal(word, event) {
            event.stopPropagation();
            const data = vocabDb[word];
            if (!data) return;

            document.getElementById('modal-kor').innerText = data.kor;
            document.getElementById('modal-pos').innerText = data.pos;
            document.getElementById('modal-pinyin').innerText = `[${data.pinyin}]`;
            document.getElementById('modal-chi').innerText = data.chi;

            // 設定點擊按鈕直接觸發發音
            const speakBtn = document.getElementById('modal-speak-btn');
            speakBtn.onclick = () => playKoreanSpeech(data.kor);

            document.getElementById('vocab-modal').style.display = 'flex';
        }

        function closeModal(event) {
            if (event.target.classList.contains('modal-overlay')) {
                document.getElementById('vocab-modal').style.display = 'none';
            }
        }

        function closeModalDirect() {
            document.getElementById('vocab-modal').style.display = 'none';
        }
    </script>
