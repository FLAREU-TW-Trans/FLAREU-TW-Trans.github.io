<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="https://flareu-tw-trans.github.io/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="https://flareu-tw-trans.github.io/images/favicon.png">
<link rel="stylesheet" href="../../css/reaction.css">
  
<title>MTN訪談合輯</title>

<style>
    /* ==================== 
       1. 色彩變數與基礎設定 (黃色系主題)
       ==================== */
    :root { 
        /* 淺色黃色系 */
        --bg-body: #FFFCF5; --bg-content: #FFFFFF; --text-main: #3D352D; --text-sub: #7A6F62; --border-line: #F4E8D1;
        --btn-bg: #F3C623; --btn-hover: #D8AD1A; --btn-text: #2C2416; --intro-bg: #FFF8E7; --intro-border: #FBE6B3; --intro-text: #4A3F33; 
        --section-bg: #FFF3CD; --section-text: #856404;      
        --tab-bg: #FFFFFF; --tab-border: #F4E8D1; --tab-text: #A09383; --tab-active-text: #D8AD1A; --tab-active-border: #F3C623;
        --home-btn-bg: #FFF8E7; --home-btn-hover: #FBE6B3; --theme-btn-bg: #F0F0F0; --theme-btn-text: #666; --theme-btn-active: #FFFFFF;     
        --reaction-text-shadow: none; --emoji-btn-active-border: #F3C623; --emoji-btn-active-text: #3D352D; --emoji-btn-bg-hover: rgba(243, 198, 35, 0.1); 
        --emoji-btn-default-bg: rgba(0, 0, 0, 0.02); --emoji-btn-default-border: #E8E1D5; --emoji-btn-default-text: #8E8579; --subtitle-size: 22px; 
    }

    [data-theme="dark"] {
        /* 深色模式 */
        --bg-body: #161512; --bg-content: #22201D; --text-main: #EAE6DF; --text-sub: #A69E93; --border-line: #3D3A35;
        --btn-bg: #CFA61E; --btn-hover: #F3C623; --btn-text: #161512; --intro-bg: #2C2924; --intro-border: #4A453A; --intro-text: #D4CDAC; 
        --section-bg: #332D20; --section-text: #E8CC78;     
        --tab-bg: #22201D; --tab-border: #3D3A35; --tab-text: #888; --tab-active-text: #E8CC78; --tab-active-border: #CFA61E;       
        --home-btn-bg: #33302A; --home-btn-hover: #444038; --theme-btn-bg: #2A2A2A; --theme-btn-text: #999; --theme-btn-active: #111;
        --reaction-text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
        --emoji-btn-active-border: #E8CC78; --emoji-btn-active-text: #F8F5EE; --emoji-btn-bg-hover: rgba(255, 255, 255, 0.08); 
        --emoji-btn-default-bg: rgba(255, 255, 255, 0.05); --emoji-btn-default-border: #444; --emoji-btn-default-text: #AAA;
    }

    html, body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; 
        overflow-x: hidden; height: auto; -webkit-text-size-adjust: 100%;
        display: flex; justify-content: center; 
        transition: background-color 0.3s ease, color 0.3s ease; 
    }

    .content-wrapper { 
        max-width: 800px; width: 100%; background: var(--bg-content); min-height: 100vh; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding-bottom: 40px; transition: all 0.3s ease; 
    }

    /* ==================== 
       2. 版面與導覽列
       ==================== */
    .header { background-color: var(--bg-content); padding: 30px 20px 0 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .header h1 { font-size: 1.4rem; margin: 0; font-weight: 800; color: var(--text-main); line-height: 1.4; letter-spacing: 0.5px; }

    .controls-wrapper { display: flex; gap: 12px; align-items: center; margin-top: 15px; margin-bottom: 20px; }
    .home-btn { background-color: var(--home-btn-bg); color: var(--text-main); text-decoration: none; padding: 8px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
    .home-btn:hover { background-color: var(--home-btn-hover); }
    
    .theme-toggle-group { display: inline-flex; background-color: var(--theme-btn-bg); border-radius: 24px; padding: 4px; }
    .theme-btn { background: none; border: none; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; color: var(--theme-btn-text); cursor: pointer; font-weight: bold; transition: all 0.2s; }
    .theme-btn.active { background-color: var(--theme-btn-active); color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

    .tabs-container { display: flex; width: 100%; border-bottom: 2px solid var(--tab-border); background-color: var(--tab-bg); }
    .tab-btn { flex: 1; background: none; border: none; padding: 16px 10px; font-size: 1.05rem; font-weight: bold; color: var(--tab-text); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: var(--tab-active-text); border-bottom: 3px solid var(--tab-active-border); }

    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ==================== 
       3. 文章文字排版
       ==================== */
    .article-container { padding: 0 25px; text-align: left; }
    
    .btn-article { display: block; background-color: var(--btn-bg); color: var(--btn-text); text-align: center; padding: 14px 20px; margin: 20px 0; border-radius: 12px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(243, 198, 35, 0.2); transition: transform 0.2s; }
    .btn-article:hover { transform: translateY(-2px); }

    .intro-text { font-size: 1.05rem; line-height: 1.8; color: var(--intro-text); padding: 25px; background-color: var(--intro-bg); border-radius: 12px; border: 1px solid var(--intro-border); margin-bottom: 30px; }
    .intro-text h3 { margin-top: 0; color: var(--section-text); font-size: 1.2rem; margin-bottom: 15px; }

    .image-caption { font-size: 0.9rem; color: var(--text-sub); border-left: 3px solid var(--btn-bg); padding-left: 12px; margin: 20px 0; line-height: 1.6; background: rgba(0,0,0,0.02); padding-top: 8px; padding-bottom: 8px; border-radius: 0 8px 8px 0; }
    .image-caption strong { color: var(--section-text); }

    .qa-block { margin-bottom: 35px; }
    .question { font-size: 1.15rem; font-weight: 700; color: var(--section-text); margin-bottom: 12px; line-height: 1.6; }
    .answer { font-size: 1.05rem; line-height: 1.8; color: var(--text-main); margin-bottom: 10px; padding-left: 5px; }
    .speaker { font-weight: 700; color: var(--text-main); background: var(--intro-border); padding: 2px 8px; border-radius: 4px; font-size: 0.95rem; margin-right: 5px; display: inline-block; margin-bottom: 4px;}

    .highlight-quote { font-size: 1.15rem; font-style: italic; font-weight: 600; color: var(--section-text); text-align: center; margin: 40px 10px; padding: 25px; border-top: 2px dashed var(--intro-border); border-bottom: 2px dashed var(--intro-border); line-height: 1.7; background: var(--intro-bg); border-radius: 16px; }
    .quote-author { display: block; font-size: 0.95rem; font-style: normal; font-weight: bold; margin-top: 15px; color: var(--text-sub); }

    hr.divider { border: 0; height: 1px; background: var(--intro-border); margin: 40px 0; }

    /* ==================== 
       4. 影片區塊與字幕樣式
       ==================== */
    .video-controls-bar { background: var(--bg-content); padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; border-bottom: 1px solid var(--border-line); }
    .video-controls-bar button { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 8px 18px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.3s ease; }
    .video-controls-bar button:hover { background: var(--btn-hover); transform: translateY(-1px); }

    .video-responsive-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; transition: all 0.3s ease; }
    .video-responsive-wrapper iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; display: block; }

    .subtitle-overlay { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8%; width: 90vw; max-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 16px); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); box-sizing: border-box; z-index: 100; pointer-events: none; display: flex; justify-content: center; text-align: center; }
    .subtitle-overlay span { display: block; width: 100%; max-width: 100%; padding: 0.25em 0.7em; background: rgba(0,0,0,0.72); border-radius: 8px; color: rgba(255,255,255,0.96); font-size: var(--subtitle-size); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; text-shadow: 0 2px 4px rgba(0,0,0,.5); backdrop-filter: blur(2px); box-sizing: border-box; }
    
    @media (min-width: 1024px) { .subtitle-overlay { font-size: 28px; line-height: 1.7; } }

    /* ==================== 
       5. 彈幕與即時表情樣式
       ==================== */
    .control-group-wrapper { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.03); padding: 5px 12px; border-radius: 20px; }
    .barrage-control { display: flex; align-items: center; gap: 5px; color: var(--text-main); font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .barrage-control input[type="range"] { accent-color: var(--btn-bg); cursor: pointer; max-width: 70px; }
    
    /* 彈幕層 */
    #barrage-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; overflow: hidden; }
    
    /* 觸發表情的按鈕 */
    #emoji-trigger-btn {
        position: absolute; bottom: 15px; right: 15px; z-index: 60;
        background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.8);
        border-radius: 50%; width: 45px; height: 45px; font-size: 24px;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; transition: transform 0.2s; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #emoji-trigger-btn:hover { transform: scale(1.1); background: rgba(0,0,0,0.8); }

    /* 表情抽屜面板 */
    #emoji-drawer {
        position: absolute; bottom: 70px; right: 15px; z-index: 60;
        background: rgba(20,20,20,0.8); border-radius: 12px; padding: 10px;
        display: none; flex-wrap: wrap; gap: 8px; max-width: 200px; 
        backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
    }

    /* 退出全螢幕按鈕 */
    .exit-fs-btn-global {
        display: none; opacity: 0; position: fixed !important; top: 20px !important; right: 20px !important; 
        width: 50px !important; height: 50px !important; background: rgba(0, 0, 0, 0.6) !important; 
        border: 1px solid rgba(255, 255, 255, 0.3) !important; border-radius: 50%; color: white !important; 
        z-index: 2147483647 !important; cursor: pointer; align-items: center; justify-content: center; padding: 0;
    }
    .exit-fs-btn-global svg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 2.5; fill: none; }

    /* ==================== 
       6. 表情牆修復 (下方靜態表情)
       ==================== */
    .unified-reaction-box { background-color: var(--section-bg) !important; border-radius: 16px; margin: 30px 20px; padding: 25px; text-align: center; border: 1px solid var(--intro-border); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
    .reaction-section { text-align: center !important; width: 100%; background: transparent !important; height: auto !important; min-height: 0 !important; padding: 0 !important; margin: 0 !important; }
    .reaction-wall { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 15px; background: transparent !important;}

    .unified-reaction-box .emoji-btn:not(.active) { background-color: var(--emoji-btn-default-bg) !important; border: 1px solid var(--emoji-btn-default-border) !important; transition: all 0.2s ease; transform: scale(1) translateY(0) !important; box-shadow: none !important; }
    .unified-reaction-box p, .unified-reaction-box span { color: var(--text-main) !important; font-size: 1.05rem !important; text-shadow: var(--reaction-text-shadow) !important; box-shadow: none !important; }
    .unified-reaction-box .emoji-btn { background-color: transparent !important; border: 1px solid var(--border-line) !important; transition: all 0.2s ease; }
    .unified-reaction-box .emoji-btn span { color: var(--text-sub) !important; text-shadow: none !important; }
    .unified-reaction-box .emoji-btn:hover { background-color: var(--emoji-btn-bg-hover) !important; }
    .unified-reaction-box .emoji-btn.active { background-color: transparent !important; border: 2px solid var(--emoji-btn-active-border) !important; transform: scale(1.05) translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1) !important; }
    .unified-reaction-box .emoji-btn.active span { color: var(--emoji-btn-active-text) !important; font-weight: bold !important; }
    #reaction-title { color: var(--text-main) !important; font-weight: bold !important; margin-bottom: 20px !important; text-shadow: var(--reaction-text-shadow) !important; }
</style>
</head>

<body>
<div class="content-wrapper">

    <header class="header">
      <h1>MTN訪談合輯</h1>

      <div class="controls-wrapper">
        <a href="/" class="home-btn">🏠 首頁</a> 
        <div class="theme-toggle-group">
          <button class="theme-btn active" id="btn-light" onclick="switchTheme('light')">☀️ 淺色</button>
          <button class="theme-btn" id="btn-dark" onclick="switchTheme('dark')">🌙 深色</button>
        </div>
      </div>

      <div class="tabs-container">
        <button class="tab-btn active" onclick="openTab('tab-pictorial', this)">📸 文章</button>
        <button class="tab-btn" onclick="openTab('tab-video', this)">🎬 影片</button>
      </div>
    </header>

    <div id="tab-pictorial" class="tab-content active">
        <div class="article-container">
            <a href="https://news.mtn.co.kr/news-detail/2026101214434847453" target="_blank" class="btn-article">
                👉 點此開啟 MTN 官方文章看原文報導
            </a>

        </div>
    </div>

    <div id="tab-video" class="tab-content">
        <div id="controls" class="video-controls-bar">
            <div class="control-group-wrapper">
                <button class="sub-btn" onclick="changeSubtitleSize(-0.1)">A−</button>
                <span style="font-weight: bold; color: var(--text-main); font-size: 14px;">字幕</span>
                <button class="sub-btn" onclick="changeSubtitleSize(0.1)">A＋</button>
            </div>
            
            <button onclick="toggleBarrageDisplay()" id="barrage-toggle-btn">即時表情：開</button>
            
            <div class="control-group-wrapper">
                <div class="barrage-control">
                    <span>大小</span>
                    <input type="range" id="barrage-size-slider" min="16" max="60" value="24" oninput="updateBarrageSize(this.value)">
                </div>
                <div class="barrage-control">
                    <span>範圍</span>
                    <input type="range" id="barrage-height-slider" min="10" max="100" value="40" oninput="document.getElementById('height-val').innerText = this.value + '%'; document.getElementById('barrage-container').style.height = this.value + '%'; if(typeof updateBarrageHeight === 'function') updateBarrageHeight(this.value);">
                    <span id="height-val">40%</span>
                </div>
                <div class="barrage-control">
                    <span>速度</span>
                    <input type="range" id="barrage-speed-slider" min="3" max="10" step="1" value="5" oninput="updateBarrageSpeed(this.value)">
                </div>
            </div>

            <button id="fs-btn">進入全螢幕</button>
        </div>

        <div id="video-wrapper" class="video-responsive-wrapper">
            <div id="player"></div>
            <div id="subtitle" class="subtitle-overlay"><span>字幕載入中...</span></div>
            
            <div id="barrage-container"></div>
            
            <button id="emoji-trigger-btn" onclick="toggleEmojiDrawer(event)">😊</button>
            
            <div id="emoji-drawer"></div>
            
            <button id="exit-fs-btn" class="exit-fs-btn-global" title="退出全螢幕">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="unified-reaction-box">
        <div class="reaction-section">
            <p id="reaction-title">覺得這篇翻譯專訪/影片如何？點個表情吧！</p>
            <div class="reaction-wall"></div>
        </div>
    </div>

</div>

<script>
    /* 影片ID和SRT文件設定 */
    const MY_VIDEO_ID = "Za4Piy6_2SA"; 
    const MY_SRT_FILE = "20261017_MTN.srt";

    /* 字幕大小設定 */
    function changeSubtitleSize(delta) {
        if (typeof coreChangeSubtitleSize === "function") coreChangeSubtitleSize(delta);
    }

    /* 分頁切換功能 */
    function openTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    /* 主題切換功能 */
    function switchTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('btn-light').classList.remove('active');
        document.getElementById('btn-dark').classList.remove('active');
        document.getElementById('btn-' + theme).classList.add('active');
    }

    /* 紀錄即時表情範圍 */
    document.getElementById('barrage-container').style.height = document.getElementById('barrage-height-slider').value + '%';
</script>
    
<script type="module" src="../../js/firebase-init.js"></script>

<script src="../../js/core-player.js"></script>
<script src="../../js/reaction-core.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
