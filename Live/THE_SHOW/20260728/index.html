<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="https://flareu-tw-trans.github.io/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="https://flareu-tw-trans.github.io/images/favicon.png">
<link rel="stylesheet" href="../../../css/reaction.css">
  
<title>20260728 THE SHOW MC TALK (特別MC:VAYONN-Masato、MANO)</title>

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, "Noto Sans TC", sans-serif;
    text-align: center;
}

html, body {
    background: #000 !important; 
    height: 100%;
    width: 100%;
    margin: 0;
}

/* 章節按鈕容器 */
.chapter-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px 0; overflow-x: auto; padding: 6px 4px; scrollbar-width: thin; justify-content: safe center; }
.chapter-row::-webkit-scrollbar { height: 4px; }
.chapter-row::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

/* 按鈕基本樣式 */
.chapter-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.12); color: var(--text-main, #fff);
    font-size: 1.00rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); flex-shrink: 0;
}

/* 時間標籤 */
.chapter-time {
    background: rgba(255, 255, 255, 0.12); padding: 2px 6px; border-radius: 10px; font-size: 0.85rem; font-family: monospace;
    opacity: 0.9; letter-spacing: 0.5px;
}

/* 章節標題 */
.chapter-title {
    max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: max-width 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease; opacity: 0.85;
}
.chapter-btn:hover {
    background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15); transform: translateY(-1px);
}
.chapter-btn:hover .chapter-title { max-width: 250px; opacity: 1; }
.chapter-btn:active { transform: translateY(0) scale(0.97); }

</style>
</head>

<body>
<div id="controls">
    <div class="control-row">
        <button onclick="toggleBarrageDisplay()" id="barrage-toggle-btn">即時表情：開</button>

        <div class="control-group barrage-control">
            <span>大小</span>
            <input type="range" id="barrage-size-slider" min="16" max="60" value="24" oninput="updateBarrageSize(this.value)">
        </div>

        <div class="control-group barrage-control">
            <span>範圍</span>
            <input type="range" id="barrage-height-slider" min="10" max="100" value="40" oninput="updateBarrageHeight(this.value)">
            <span id="height-val">40%</span>
        </div>

        <div class="control-group barrage-control">
            <span>速度</span>
            <input type="range" id="barrage-speed-slider" min="3" max="10" step="1" value="5" oninput="updateBarrageSpeed(this.value)">
        </div>

        <div class="control-group">
            <button class="sub-btn" onclick="changeSubtitleSize(-0.1)">A−</button>
            <span>字幕</span>
            <button class="sub-btn" onclick="changeSubtitleSize(0.1)">A＋</button>
        </div>
        <button id="home-btn" onclick="window.location.href='/'">首頁</button>
        <button id="fs-btn">進入全螢幕</button>
    </div>
</div>

<h2>20260728 THE SHOW MC TALK (特別MC:VAYONN-Masato、MANO)</h2>

<div class="chapter-row">
    <button class="chapter-btn" onclick="seekToTime(0)">
        <span class="chapter-time">00:00</span>
        <span class="chapter-title">part1</span>
    </button>
    <button class="chapter-btn" onclick="seekToTime(111)">
        <span class="chapter-time">01:51</span>
        <span class="chapter-title">part2</span>
    </button>
    <button class="chapter-btn" onclick="seekToTime(180)">
        <span class="chapter-time">03:00</span>
        <span class="chapter-title">part3 訪問團體:LUN8</span>
    </button>
    <button class="chapter-btn" onclick="seekToTime(315)">
        <span class="chapter-time">05:15</span>
        <span class="chapter-title">part4 訪問團體:idntt</span>
    </button>
    <button class="chapter-btn" onclick="seekToTime(494)">
        <span class="chapter-time">08:14</span>
        <span class="chapter-title">part5</span>
    </button>
    <button class="chapter-btn" onclick="seekToTime(519)">
        <span class="chapter-time">08:39</span>
        <span class="chapter-title">結尾頒獎</span>
    </button>
</div>

<div id="video-wrapper">
    <div id="player"></div>
    <div id="subtitle">字幕載入中...</div>
    <div id="barrage-container"></div>

    <button id="emoji-trigger-btn" onclick="toggleEmojiDrawer(event)">😊</button>

    <div id="emoji-drawer"></div>
    
    <button id="exit-fs-btn" title="退出全螢幕" style="display: none; opacity: 0;">
        <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>

<div class="reaction-section">
    <p id="reaction-title">覺得這部翻譯影片如何？點個表情吧！</p>
    <div class="reaction-wall"></div>
    <br>
</div>

<script>
/* 影片ID和SRT文件 */
const MY_VIDEO_ID = "ZQqvqZtiaI4"; 
const MY_SRT_FILE = "20260728_THESHOW_MC_TALK.srt";

/* 字幕大小設定 */
function changeSubtitleSize(delta) {
        if (typeof coreChangeSubtitleSize === "function") coreChangeSubtitleSize(delta);
}

/* 按鈕跳轉 */
function seekToTime(seconds) {
    if (window.player && typeof window.player.seekTo === 'function') {
        window.player.seekTo(seconds, true);
        window.player.playVideo(); 
    } else {
        console.warn("YouTube Player 尚未準備就緒");
    }
}
</script>
    
<script type="module" src="../../../js/firebase-init.js"></script>

<script src="../../../js/core-player.js"></script>
<script src="../../../js/reaction-core.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
