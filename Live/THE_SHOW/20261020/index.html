<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="https://flareu-tw-trans.github.io/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="https://flareu-tw-trans.github.io/images/favicon.png">
<link rel="stylesheet" href="../../../css/reaction.css">
  
<title>20261020 THE SHOW翻譯合輯</title>

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, "Noto Sans TC", sans-serif;
    text-align: center;
}

html, body {
    background: #000 !important; 
    height: 100%;
    width: 100%;
    margin: 0;
}

/* 頂部導覽頁籤列 (切換不同的翻譯影片) */
.video-tabs-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px 10px 5px 10px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
}
.video-tab-btn {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #aaa;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}
.video-tab-btn.active {
    background: #3498db;
    color: #fff;
    border-color: #2980b9;
    box-shadow: 0 0 10px rgba(52, 152, 219, 0.4);
}

/* 內容面板預設隱藏，active 時顯示 */
.video-panel {
    display: none;
}
.video-panel.active {
    display: block;
}

/* 章節按鈕容器 */
.chapter-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px 0; overflow-x: auto; padding: 6px 4px; scrollbar-width: thin; justify-content: safe center; }
.chapter-row::-webkit-scrollbar { height: 4px; }
.chapter-row::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

/* 按鈕基本樣式 */
.chapter-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.12); color: var(--text-main, #fff);
    font-size: 1.00rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); flex-shrink: 0;
}

/* 時間標籤 */
.chapter-time {
    background: rgba(255, 255, 255, 0.12); padding: 2px 6px; border-radius: 10px; font-size: 0.85rem; font-family: monospace;
    opacity: 0.9; letter-spacing: 0.5px;
}

/* 章節標題 */
.chapter-title {
    max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: max-width 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease; opacity: 0.85;
}
.chapter-btn:hover {
    background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15); transform: translateY(-1px);
}
.chapter-btn:hover .chapter-title { max-width: 250px; opacity: 1; }
.chapter-btn:active { transform: translateY(0) scale(0.97); }

</style>
</head>

<body>
<div class="video-tabs-row">
    <button class="video-tab-btn active" onclick="switchVideoTab('tab1', this)">20261020 THE SHOW MC TALK</button>
    <button class="video-tab-btn" onclick="switchVideoTab('tab2', this)">20261023 JJaeLiView BEHIND</button>
</div>

<div id="controls">
    <div class="control-row">
        <button onclick="toggleBarrageDisplay()" id="barrage-toggle-btn">即時表情：開</button>

        <div class="control-group barrage-control">
            <span>大小</span>
            <input type="range" id="barrage-size-slider" min="16" max="60" value="24" oninput="updateBarrageSize(this.value)">
        </div>

        <div class="control-group barrage-control">
            <span>範圍</span>
            <input type="range" id="barrage-height-slider" min="10" max="100" value="40" oninput="updateBarrageHeight(this.value)">
            <span id="height-val">40%</span>
        </div>

        <div class="control-group barrage-control">
            <span>速度</span>
            <input type="range" id="barrage-speed-slider" min="3" max="10" step="1" value="5" oninput="updateBarrageSpeed(this.value)">
        </div>

        <div class="control-group">
            <button class="sub-btn" onclick="changeSubtitleSize(-0.1)">A−</button>
            <span>字幕</span>
            <button class="sub-btn" onclick="changeSubtitleSize(0.1)">A＋</button>
        </div>
        <button id="home-btn" onclick="window.location.href='/'">首頁</button>
        <button id="fs-btn">進入全螢幕</button>
    </div>
</div>

<!-- ================= THE SHOW MC TALK ================= -->
<div id="tab1" class="video-panel active">
    <h2>20261020 THE SHOW MC TALK</h2>

    <div class="chapter-row">
        <button class="chapter-btn" onclick="seekToTime(0)">
            <span class="chapter-time">00:00</span>
            <span class="chapter-title">part1</span>
        </button>
        <button class="chapter-btn" onclick="seekToTime(141)">
            <span class="chapter-time">02:21</span>
            <span class="chapter-title">part2 訪問團體:MODYSSEY</span>
        </button>
        <button class="chapter-btn" onclick="seekToTime(271)">
            <span class="chapter-time">04:31</span>
            <span class="chapter-title">part3 訪問團體:KO1KEYZ</span>
        </button>
        <button class="chapter-btn" onclick="seekToTime(393)">
            <span class="chapter-time">06:32</span>
            <span class="chapter-title">part4 訪問團體:FLARE U</span>
        </button>
        <button class="chapter-btn" onclick="seekToTime(765)">
            <span class="chapter-time">12:45</span>
            <span class="chapter-title">part5</span>
        </button>
        <button class="chapter-btn" onclick="seekToTime(925)">
            <span class="chapter-time">15:25</span>
            <span class="chapter-title">結尾頒獎</span>
        </button>
    </div>
</div>

<!-- ================= JJaeLiView BEHIND ================= -->
<div id="tab2" class="video-panel">
    <h2>20261023 JJaeLiView BEHIND</h2>
</div>

<!-- 共用的播放器與字幕外框 -->
<div id="video-wrapper">
    <div id="player"></div>
    <div id="subtitle">字幕載入中...</div>
    <div id="barrage-container"></div>

    <button id="emoji-trigger-btn" onclick="toggleEmojiDrawer(event)">😊</button>

    <div id="emoji-drawer"></div>
    
    <button id="exit-fs-btn" title="退出全螢幕" style="display: none; opacity: 0;">
        <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>

<div class="reaction-section">
    <p id="reaction-title">覺得這部翻譯影片如何？點個表情吧！</p>
    <div class="reaction-wall"></div>
    <br>
</div>

<script>
/* 定義各個影片的 ID 與對應的 SRT 檔案 */
const videoConfigs = {
    'tab1': {
        videoId: "VgDyxZBHMtA",
        srtFile: "20261020_THESHOW_MC_TALK.srt"
    },
    'tab2': {
        videoId: "mh6LjWd123k", 
        srtFile: "20261023_JJaeLiView_BEHIND.srt"
    }
};

/* 預設載入的第一個影片 */
let MY_VIDEO_ID = videoConfigs['tab1'].videoId;
let MY_SRT_FILE = videoConfigs['tab1'].srtFile;

/* 切換翻譯影片分頁 */
function switchVideoTab(tabKey, btnElement) {
    // 1. 切換上方按鈕 active 狀態
    document.querySelectorAll('.video-tab-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    // 2. 切換下方對應的內容面板 (顯示/隱藏章節列)
    document.querySelectorAll('.video-panel').forEach(panel => panel.classList.remove('active'));
    document.getElementById(tabKey).classList.add('active');

    // 3. 更新當前影片與字幕設定
    const config = videoConfigs[tabKey];
    MY_VIDEO_ID = config.videoId;
    MY_SRT_FILE = config.srtFile;

    // 4. 如果核心播放器支援切換影片，直接載入新影片
    if (window.player && typeof window.player.loadVideoById === 'function') {
        window.player.loadVideoById(MY_VIDEO_ID);
    } else if (typeof loadVideoConfig === 'function') {
        // 相容 core-player.js 內建的重新載入函式
        loadVideoConfig(MY_VIDEO_ID, MY_SRT_FILE);
    } else {
        // 若初始化尚未完成，重新整理或重新初始化頁面
        location.reload();
    }
}

/* 字幕大小設定 */
function changeSubtitleSize(delta) {
        if (typeof coreChangeSubtitleSize === "function") coreChangeSubtitleSize(delta);
}

/* 按鈕跳轉 */
function seekToTime(seconds) {
    if (window.player && typeof window.player.seekTo === 'function') {
        window.player.seekTo(seconds, true);
        window.player.playVideo(); 
    } else {
        console.warn("YouTube Player 尚未準備就緒");
    }
}
</script>
    
<script type="module" src="../../../js/firebase-init.js"></script>

<script src="../../../js/core-player.js"></script>
<script src="../../../js/reaction-core.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
