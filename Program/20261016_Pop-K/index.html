<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="https://flareu-tw-trans.github.io/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="https://flareu-tw-trans.github.io/images/favicon.png">
<link rel="stylesheet" href="/css/reaction.css">
  
<title>完唱大作戰</title>

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, "Noto Sans TC", sans-serif;
    text-align: center;
}

html, body {
    background: #000 !important; /* 強制全黑 */
    height: 100%;
    width: 100%;
    margin: 0;
}

/* ==================== 
   結尾感言區塊
   ==================== */
.ending-message-box {
        background: linear-gradient(135deg, rgba(255, 228, 235, 0.6), rgba(255, 214, 225, 0.4));
        border: 1.5px solid rgba(255, 150, 180, 0.4);
        border-radius: 18px;
        padding: 22px 25px;
        margin: 25px 20px 10px 20px;
        text-align: center;
        box-shadow: 0 6px 20px rgba(255, 182, 193, 0.25);
    }

    .ending-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #e0567b; /* 溫暖明亮的玫瑰粉標題 */
        margin: 0 0 12px 0;
        letter-spacing: 0.5px;
    }

    .ending-content {
        font-size: 1.05rem;
        line-height: 1.9;
        color: #d16182; /* 柔和舒適的粉紅內文文字 */
        margin: 0;
    }

    .ending-content strong {
        color: #b82e5b; /* 清新且具有立體感的重點字顏色 */
    }

/* 完整歌曲影片按鈕 Hover 效果 */
#full-song-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,117,140,0.5); }

</style>
</head>

<body>
<div id="controls">
    <div class="control-row">
        <button onclick="toggleBarrageDisplay()" id="barrage-toggle-btn">即時表情：開</button>

        <div class="control-group barrage-control">
            <span>大小</span>
            <input type="range" id="barrage-size-slider" min="16" max="60" value="24" oninput="updateBarrageSize(this.value)">
        </div>

        <div class="control-group barrage-control">
            <span>範圍</span>
            <input type="range" id="barrage-height-slider" min="10" max="100" value="40" oninput="updateBarrageHeight(this.value)">
            <span id="height-val">40%</span>
        </div>

        <div class="control-group barrage-control">
            <span>速度</span>
            <input type="range" id="barrage-speed-slider" min="3" max="10" step="1" value="5" oninput="updateBarrageSpeed(this.value)">
        </div>

        <div class="control-group">
            <button class="sub-btn" onclick="changeSubtitleSize(-0.1)">A−</button>
            <span>字幕</span>
            <button class="sub-btn" onclick="changeSubtitleSize(0.1)">A＋</button>
        </div>
        <a href="https://www.youtube.com/watch?v=T9CfW2e0uos" target="_blank" id="full-song-btn" style="background: linear-gradient(135deg, #ff758c, #ff7eb3); color: #FFFFFF; border: none; padding: 7px 16px; border-radius: 20px; font-weight: bold; text-decoration: none; display: inline-block; box-shadow: 0 3px 8px rgba(255,117,140,0.35); transition: all 0.2s ease;">🎵 完整歌曲影片</a>
        <button id="home-btn" onclick="window.location.href='/'">首頁</button>
        <button id="fs-btn">進入全螢幕</button>
    </div>
</div>

<h2>完唱大作戰</h2>

<div id="video-wrapper">
    <div id="player"></div>
    <div id="subtitle">字幕載入中...</div>
    <div id="barrage-container"></div>

    <button id="emoji-trigger-btn" onclick="toggleEmojiDrawer(event)">😊</button>

    <div id="emoji-drawer"></div>
    
    <button id="exit-fs-btn" title="退出全螢幕" style="display: none; opacity: 0;">
        <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>

<div class="ending-message-box">
    <p class="ending-title">完整歌曲影片結尾感言</p>
    <p class="ending-content">
        <strong>U'RE謝謝你們！！</strong>－玗進<br>
        <strong>多虧了U'RE們我們成功了喔！♡ 最愛你們了！♡</strong>－立于
    </p>
</div>

<div class="reaction-section">
    <p id="reaction-title">覺得這部翻譯影片如何？點個表情吧！</p>
    <div class="reaction-wall"></div>
    <br>
</div>

<script>
/* 影片ID和SRT文件 */
const MY_VIDEO_ID = "qQLTTdtvXZY"; 
const MY_SRT_FILE = "20260717_Another_Class_2026.srt";

/* ===== 字幕大小設定 ===== */
function changeSubtitleSize(delta) {
        if (typeof coreChangeSubtitleSize === "function") coreChangeSubtitleSize(delta);
}
</script>
    
<script type="module" src="../../js/firebase-init.js"></script>

<script src="/js/core-player.js"></script>
<script src="/js/reaction-core.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
